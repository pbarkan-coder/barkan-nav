name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # signing/release.p12 is an encrypted key file. It is useless without
      # its password, which lives only in the KEYSTORE_PASSWORD secret.
      - name: Build signed APK
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: tripapp
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "BarkanNav-1.0.${GITHUB_RUN_NUMBER}.apk"

      # Without the password: a test build only, to check that the code compiles.
      - name: Build test APK
        if: ${{ env.HAS_KEY != 'true' }}
        env:
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" "$RUNNER_TEMP/gradle.log" | head -40 | sed -E 's#file://[^ ]*/java/##' | while IFS= read -r l; do echo "::error::$l"; done
          grep -A6 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: BarkanNav-apk
          path: |
            BarkanNav-*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Publish release
        if: ${{ hashFiles('BarkanNav-*.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BarkanNav 1.0.${{ github.run_number }}
          files: BarkanNav-*.apk
